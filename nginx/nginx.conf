# Map to check if request lacks X-Forwarded-Proto (direct access)
map $http_x_forwarded_proto $reject_direct {
    default 0;
    "" 1;
}

# Map to check if request is from Kubernetes probe
map $http_user_agent $is_kube_probe {
    default 0;
    "~*kube-probe" 1;
}

# Use forwarded protocol if available, otherwise https
map $http_x_forwarded_proto $proto {
    default "https";
    http "http";
    https "https";
}

# Use forwarded host if available, otherwise original host
map $http_x_forwarded_host $forwarded_host {
    default $http_host;
    "" $http_host;
    ~^(.+)$ $1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Reject direct requests (no X-Forwarded-Proto) unless it's a kube-probe
    set $block "";
    if ($reject_direct) {
        set $block R;
    }
    if ($is_kube_probe) {
        set $block "";
    }
    if ($block = R) {
        return 444;
    }

    # Redirect directory requests without trailing slash to with trailing slash
    rewrite ^([^.]*[^/])$ $proto://$forwarded_host$uri/ permanent;

    # Serve index.html for directory requests
    index index.html;

    # Serve custom error pages
    error_page 404 =404 /404.html;
    error_page 500 502 503 504 =500 /50x.html;

    # Cache busting for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json;
}
